<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autonomous Logistics Command Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#fdf1f4;--p:#ffffff;--p2:#f6f3fd;--ln:#e9e2f3;--tx:#1b2a5c;--mu:#6a7599;--cy:#5b6cf0;--gr:#2f9a76;--am:#c28a00;--pk:#ff6b6b;
--f:Inter,system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--f)}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:14px;padding:10px 20px;background:#fdf1f4ee;border-bottom:1px solid var(--ln);backdrop-filter:blur(8px);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}.logo i{width:30px;height:30px;border:1px solid var(--cy);border-radius:8px;display:grid;place-items:center;color:var(--cy);font-style:normal;box-shadow:0 3px 10px #5b6cf033}
.logo small{display:block;font:400 11px var(--m);color:var(--mu);letter-spacing:.04em}
.sp{flex:1}.pill{font:500 12px var(--m);color:var(--mu);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gr);}.dot.off{background:var(--mu);box-shadow:none}
.btn{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:7px 13px;font-weight:500;transition:border-color .15s,background .15s}.btn:hover{border-color:var(--cy)}
.btn.pri{background:var(--cy);color:#ffffff;border-color:var(--cy);font-weight:600}.btn.on{border-color:var(--am);color:var(--am)}.btn.bad{border-color:#ff6b6b77;color:var(--pk)}.btn:disabled{opacity:.4;cursor:default}
.wrap{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 56px)}
nav{padding:18px 12px;border-right:1px solid var(--ln);position:sticky;top:57px;align-self:start;height:calc(100vh - 57px)}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--mu);text-decoration:none;border-left:2px solid transparent;margin-bottom:2px}nav a:hover{color:var(--tx);background:var(--p)}
nav a.act{color:var(--cy);background:#5b6cf010;border-color:var(--cy)}
main{padding:20px;display:grid;gap:16px;min-width:0}
.row{display:grid;gap:16px;min-width:0}.r6{grid-template-columns:repeat(6,1fr)}.r2{grid-template-columns:1.9fr 1fr}.r3{grid-template-columns:1.5fr 1fr}.r4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--p);border:1px solid var(--ln);border-radius:18px;padding:18px;box-shadow:0 6px 22px #5b6cf012;min-width:0}
.card h3{margin:0 0 2px;font-size:17px}.lab{font:500 11.5px var(--m);color:var(--mu)}.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.met b{display:block;font:600 28px var(--f);margin:4px 0 2px;font-variant-numeric:tabular-nums}.met small{color:var(--mu);font:12px var(--m)}
.met.warn b{color:var(--pk)}
.mapbox{position:relative;border:1px solid var(--ln);border-radius:10px;background:#fbf9ff;overflow:hidden}
svg.map{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:430px;margin:0 auto}body[data-view=map] svg.map{max-height:680px}body[data-view=tl] .tl{max-height:none}.ixd{display:grid;grid-template-columns:1fr 1fr;gap:16px}.ixd .ixc{padding:16px}.ixd h4{margin:12px 0 4px;font:500 11.5px var(--m);color:var(--mu)}.ixd p.e{margin:3px 0;font-size:13px;color:var(--tx)}@media(max-width:900px){.ixd{grid-template-columns:1fr}}
.veh{cursor:pointer}.veh rect{fill:#ffffff;stroke-width:1.2}.veh text{font:700 5.5px var(--m);fill:#1b2a5c;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.veh.idle rect{stroke:var(--gr)}.veh.delivering rect{stroke:var(--cy);filter:drop-shadow(0 2px 3px #5b6cf055)}.veh.negotiating rect{stroke:var(--am);filter:drop-shadow(0 0 4px #c28a00aa)}
.veh.failed rect{stroke:var(--pk);fill:#ffe9e9;filter:drop-shadow(0 0 4px #ff6b6baa)}.veh.sel rect{stroke-width:2.2}.veh.low rect{stroke-dasharray:2 1.5}
.ring{fill:none;stroke:var(--am);stroke-width:.8;stroke-dasharray:3 2}.ring.busy{stroke:var(--pk);animation:sp 6s linear infinite;transform-origin:center;transform-box:fill-box}@keyframes sp{to{transform:rotate(360deg)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 4px 0;font:11.5px var(--m);color:var(--mu)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{padding:4px 10px;border-radius:7px;border:1px solid var(--ln);background:var(--p2);font:600 12px var(--m)}.chip.sel{border-color:var(--cy);color:var(--cy)}
.chip.s-failed{color:var(--pk)}.chip.s-negotiating{color:var(--am)}
.dec{border:1px solid #5b6cf044;background:#f1eefc;border-radius:10px;padding:12px;margin:10px 0}.dec .lab{color:var(--cy)}.dec p{margin:6px 0 0}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--ln);font-size:13px}.kv span:first-child{color:var(--mu)}.kv b{font:600 13px var(--m)}
.ix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.ixc{border:1px solid var(--ln);border-radius:10px;padding:10px;background:var(--p2)}.ixc b{font:700 14px var(--m)}
.ixc.busy{border-color:var(--am)}.ixc p{margin:4px 0 0;font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse}th{font:500 11.5px var(--m);color:var(--mu);text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln)}td{padding:10px 8px;border-bottom:1px solid #ece7f4;font:500 13px var(--m)}
tr.win td{background:#fff4c2}.tag{font:700 10px var(--m);color:var(--gr);border:1px solid var(--gr);border-radius:4px;padding:1px 6px;margin-left:8px}
.bidin tr{animation:in .5s both}.bidin tr:nth-child(2){animation-delay:.4s}.bidin tr:nth-child(3){animation-delay:.8s}@keyframes in{from{opacity:0;transform:translateX(-10px)}}
.why{margin-top:12px;font-size:13px;color:#4a5688}.why b{color:var(--gr)}
.tl{max-height:330px;overflow:auto;padding-right:4px}.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #ece7f4}
.ev .t{font:12px var(--m);color:var(--mu)}.ev .k{font:700 10px var(--m);letter-spacing:.03em}.ev p{margin:2px 0 0;font-size:13px}
.k.won,.k.deliv{color:var(--gr)}.k.ann,.k.pick{color:var(--cy)}.k.yield,.k.clear{color:var(--am)}.k.fail,.k.rel{color:var(--pk)}.k.re{color:#8a6cf0}
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.st{border:1px solid var(--ln);border-radius:10px;padding:12px;background:var(--p2);opacity:.5;transition:all .4s;position:relative}
.st.done{opacity:1;border-color:var(--gr)}.st.bad{opacity:1;border-color:var(--pk);box-shadow:0 0 14px #ff6b6b33}.st b{display:block;margin-bottom:4px}.st span{font:12px var(--m);color:var(--mu)}
.bar{height:8px;background:#ece7f4;border-radius:5px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--cy);transition:width .5s}
.brow{display:flex;justify-content:space-between;font:12px var(--m)}
.hold{display:none;padding:12px 16px;border:1px solid #f3dc7a;background:#fff7d6;border-radius:14px;color:var(--tx)}.evb{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:#fff7d6;border:1px solid #f3dc7a;color:var(--tx);animation:pop .4s}.evb.bad{background:#ffe8e6;border-color:#ffb3ae}.evb b{white-space:nowrap}.evb .lab{margin-left:auto}@keyframes pop{from{opacity:0;transform:translateY(-6px)}}.algn{margin:14px 0 8px;padding:12px 14px;border-radius:12px;background:#f1eefc;font-size:13px}.algrow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.algrow b{font-size:14px}@media(max-width:760px){.algrow{grid-template-columns:1fr}}.hold.show{display:block}
input[type=range]{width:100%;accent-color:var(--cy);margin-top:12px}
@media(max-width:1100px){.r6{grid-template-columns:repeat(3,1fr)}.r2,.r3{grid-template-columns:1fr}.r4{grid-template-columns:1fr 1fr}.chain{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.wrap{grid-template-columns:1fr}nav{display:none}main{padding:12px}.r6,.r4{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top">
 <div class="logo"><i>◈</i><div>Self-Healing Fleet<small>Autonomous logistics command center</small></div></div>
 <div class="sp"></div>
 <label class="pill">Algorithm <select class="btn" id="alg"><option value="cnp">Contract Net auction (engine)</option><option value="nearest">Nearest vehicle (greedy)</option><option value="battery">Highest battery first</option><option value="load">Least-loaded first</option></select></label>
 <div class="pill"><span class="dot" id="live"></span><span id="runst">Paused</span></div>
 <div class="pill" id="clock">T+00</div>
 <button class="btn" id="mode">Normal mode</button>
 <button class="btn" id="next" disabled>Next step</button>
 <button class="btn pri" id="play">Start simulation</button>
 <button class="btn" id="reset" title="Reset">Reset</button>
</header>
<div class="wrap">
<nav><a href="#ov" data-view="ov">Overview</a><a href="#map" data-view="map">Fleet &amp; map</a><a href="#bid" data-view="bid">Task bidding</a><a href="#ix" data-view="ix">Intersections</a><a href="#heal" data-view="heal">Self-healing</a><a href="#tl" data-view="tl">Event timeline</a><a href="#ana" data-view="ana">Analytics</a></nav>
<main>
 <div class="evb" id="evb" style="display:none"></div>
 <div class="hold" id="hold"></div>
 <section class="row r6" id="ov"></section>
 <section class="card" id="algs" data-v="ov bid"></section>
 <section class="row r2" id="map" data-v="ov map">
  <div class="card"><div class="hd"><div><div class="lab">Spatial telemetry</div><h3>Factory floor</h3></div><div class="lab" id="mapinfo"></div></div>
   <div class="mapbox"><svg class="map" id="svg" viewBox="0 0 300 300"></svg></div>
   <div class="legend"><span><i style="background:var(--gr)"></i>Idle</span><span><i style="background:var(--cy)"></i>Delivering</span><span><i style="background:var(--am)"></i>Yielding</span><span><i style="background:var(--pk)"></i>Failed</span><span>◆ Pickup</span><span>◎ Drop-off</span></div>
   <input type="range" id="scrub" min="0" value="0" aria-label="Simulation tick">
  </div>
  <div class="card"><div class="hd"><div><div class="lab">Decision inspector</div><h3>Why this move?</h3></div></div>
   <div class="chips" id="chips"></div><div id="insp"></div><div class="ix" id="ix"></div></div>
 </section>
 <section class="card" id="fleet" data-v="map"></section>
 <section class="card" id="ixp" data-v="ix"></section>
 <section class="row r3" id="bid" data-v="ov bid tl">
  <div class="card" id="bidc" data-v="ov bid"></div>
  <div class="card" id="tlc" data-v="ov tl"><div class="hd"><div><div class="lab">System comms</div><h3>Event timeline</h3></div></div><div class="tl" id="tl"></div></div>
 </section>
 <section class="card" id="heal" data-v="ov heal"></section>
 <section class="row r4" id="ana" data-v="ana"></section>
</main></div>
